<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Base de Contas</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <style>
        :root {
            --bg: #f1f3f6;
            --card-bg: rgba(255, 255, 255, 0.75);
            --text: #14161a;
            --text-secondary: #5f6572;
            --border: #e2e5eb;
            --primary: #16a34a;
            --primary-hover: #15803d;
            --primary-soft: #f0fdf4;
            --erro-bg: #fef2f2;
            --erro-border: #fecaca;
            --erro-text: #991b1b;
            --sombra: 0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.06);
            --sombra-hover: 0 4px 12px rgba(0,0,0,0.08), 0 16px 32px rgba(0,0,0,0.08);
            --raio: 14px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #101114;
                --card-bg: rgba(26, 28, 32, 0.7);
                --text: #f2f3f5;
                --text-secondary: #9a9fab;
                --border: #2c2f36;
                --primary: #22c55e;
                --primary-hover: #4ade80;
                --primary-soft: #142016;
                --erro-bg: #2a1616;
                --erro-border: #5c2323;
                --erro-text: #fca5a5;
                --sombra: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.25);
                --sombra-hover: 0 4px 16px rgba(0,0,0,0.4), 0 20px 40px rgba(0,0,0,0.3);
            }
        }

        * { box-sizing: border-box; }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }

        body {
            font-family: "Segoe UI", -apple-system, Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        .logo-fundo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(70vw, 560px);
            opacity: 0.05;
            z-index: -1;
            pointer-events: none;
            user-select: none;
        }

        .voltar {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            align-self: flex-start;
            margin: 0 auto 16px;
            max-width: 420px;
            width: 100%;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .voltar:hover { color: var(--primary); transform: translateX(-3px); }
        .voltar svg { width: 16px; height: 16px; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--raio);
            padding: 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--sombra);
            animation: aparecer 0.4s ease;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { font-size: 1.3rem; margin: 0 0 6px; }
        .subtitulo { color: var(--text-secondary); font-size: 0.88rem; margin: 0 0 20px; }

        input {
            width: 100%;
            padding: 13px 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input:focus-visible {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }
        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(22, 163, 74, 0.3);
        }
        button:active { transform: translateY(0); }
        button:focus-visible, input:focus-visible, .voltar:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
        }

        .msg-sucesso, .msg-erro {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            animation: aparecer 0.3s ease;
        }
        .msg-sucesso { background: var(--primary-soft); color: #166534; border: 1px solid #bbf7d0; }
        .msg-erro { background: var(--erro-bg); color: var(--erro-text); border: 1px solid var(--erro-border); }

        footer {
            margin-top: 24px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.75rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <img src="/static/logo.png" alt="" class="logo-fundo" aria-hidden="true">

    <a href="/tela/consulta" class="voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Voltar para a consulta
    </a>

    <div class="card">
        <h1>Atualizar Base de Contas</h1>
        <p class="subtitulo">Envie a planilha atualizada com os dados dos clientes.</p>

        <label for="senha" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;">Senha de autorização</label>
        <input type="password" id="senha" placeholder="Senha de autorização">

        <label for="arquivo" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;">Selecionar arquivo</label>
        <input type="file" id="arquivo" accept=".xlsx">

        <button onclick="enviar()">Enviar Planilha</button>
        <div id="msg"></div>
    </div>

    <footer>Desenvolvido pelo setor de Tecnologia da Informação — Broker LDA © 2026</footer>

    <script>
        async function enviar() {
            const senha = document.getElementById('senha').value;
            const arquivoInput = document.getElementById('arquivo');
            const msg = document.getElementById('msg');
            msg.innerHTML = '';

            if (!senha || !arquivoInput.files.length) {
                msg.innerHTML = '<div class="msg-erro">Preencha a senha e selecione um arquivo.</div>';
                return;
            }

            const formData = new FormData();
            formData.append('arquivo', arquivoInput.files[0]);

            try {
                const resposta = await fetch('/upload/planilha', {
                    method: 'POST',
                    headers: { 'X-Upload-Secret': senha },
                    body: formData
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    msg.innerHTML = `<div class="msg-erro">${dados.detail}</div>`;
                    return;
                }

                msg.innerHTML = `
                    <div class="msg-sucesso">
                        Importado com sucesso! Inseridos: ${dados.detalhes.inseridos} |
                        Atualizados: ${dados.detalhes.atualizados}
                    </div>
                `;
            } catch (erro) {
                msg.innerHTML = '<div class="msg-erro">Erro ao enviar. Tente novamente.</div>';
            }
        }
    </script>
</body>
</html>
